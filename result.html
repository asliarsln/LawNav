<!doctype html>
<html lang="tr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analiz Sonucu — LawNav</title>
    <link rel="stylesheet" href="/statics/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a href="/" class="logo" aria-label="LawNav Ana Sayfa">
          <div class="logo-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
          </div>
          <span class="logo-name">Law<span>Nav</span></span>
        </a>
        <button
          class="theme-toggle"
          data-theme-toggle
          aria-label="Tema değiştir"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div class="result-wrap">
        <nav class="breadcrumb" aria-label="Sayfa yolu">
          <a href="/">Ana Sayfa</a>
          <svg
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M9 18l6-6-6-6" />
          </svg>
          <span>Analiz Sonucu</span>
        </nav>

        <div class="result-card">
          <div class="result-icon-wrap">
            <svg
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              />
            </svg>
          </div>

          <p class="result-label">Tespit Edilen Hukuk Bölümü</p>
          <h1 class="result-value">{{ result }}</h1>
          <p class="result-desc">
            Metniniz bu hukuk dalıyla ilişkili olarak sınıflandırıldı. Daha
            kesin bir değerlendirme için bir hukukçuya danışmanızı öneririz.
          </p>

          <div class="result-actions">
            <a href="/" class="btn-primary">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
              Yeni Analiz
            </a>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>
        <span style="color: var(--color-text-muted)">Aslı Arslan</span>
        &nbsp;·&nbsp; IECSR 2024, Zurich &nbsp;·&nbsp; LawNav
      </p>
    </footer>
  </body>
</html>
